name: Build CEC Launcher APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew permissions
        run: chmod +x cec-launcher/gradlew
      - name: Build APK
        working-directory: cec-launcher
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEC-Launcher-debug
          path: cec-launcher/app/build/outputs/apk/debug/app-debug.apk
